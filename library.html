    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="99 AI Games">
    <meta name="twitter:description" content="A playable archive observing how AI coding agents make browser games.">

    <meta name="theme-color" content="#000000">
    <title>Observation Library | 99 AI Games</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23030712'/%3E%3Ctext x='16' y='22' font-family='Arial,sans-serif' font-size='13' font-weight='700' fill='%23ffffff' text-anchor='middle'%3E99%3C/text%3E%3C/svg%3E">
    <link rel="modulepreload" href="./src/archive-data.js?v=2026-06-21-theme-promo">
    <script src="./src/theme.js?v=2026-06-21-theme-promo"></script>
    <link rel="stylesheet" href="./styles/archive.css?v=2026-06-21-theme-promo">
  </head>
  <body class="archive-page library-page">
    <a class="skip-link" href="#library-main">Skip to library</a>
    <canvas id="library-signal" class="archive-signal-field page-signal" width="1200" height="720" aria-hidden="true"></canvas>
    <div class="archive-shell">
      <header class="archive-topbar" aria-label="Library navigation">
        <a class="wordmark" href="./">
          <span>99</span>
          <strong>AI Games</strong>
        </a>
        <div class="page-title">
          <p class="archive-kicker">Level 2</p>
          <h1>Observation Library</h1>
        </div>
        <p id="library-status" class="topbar-status">Loading archive...</p>
      </header>

      <main id="library-main" class="library-layout">
        <aside class="model-axis-panel" aria-label="Model timeline">
          <div class="axis-heading">
            <p class="archive-kicker">Model axis</p>
            <span id="model-count">0 models</span>
          </div>
          <div id="model-axis" class="model-axis" role="list"></div>
        </aside>

        <section class="library-stage" aria-labelledby="library-stage-title">
          <div class="library-readout">
            <div>
              <p class="archive-kicker">Current sample</p>
              <h2 id="library-stage-title">Select an observation</h2>
            </div>
            <dl id="current-readout" class="readout-grid"></dl>
            <div class="readout-actions">
              <a id="play-selected" class="archive-button primary" href="./library.html">Play</a>
              <a id="view-record" class="archive-button secondary" href="./library.html">View Record</a>
              <a id="view-promo" class="archive-button secondary" href="./library.html">Promo Page</a>
              <a id="open-metadata" class="archive-button secondary" href="./games/manifest.json">Open Metadata</a>
            </div>
          </div>

          <div id="library-error" class="archive-notice hidden" role="status"></div>
          <div id="observation-track" class="observation-track" aria-live="polite"></div>
          <div id="observation-timeline" class="observation-timeline" aria-label="Observation timeline"></div>
        </section>
      </main>

      <nav class="archive-dock" aria-label="Archive sections">
        <a aria-current="page" href="./library.html">Library</a>
        <a href="./compare.html">Compare</a>
        <a href="./press.html">Press</a>
        <a href="./log.html">Log</a>
        <a href="./games/manifest.json">Manifest</a>
      </nav>
    </div>

    <script type="module" src="./src/library.js?v=2026-06-21-theme-promo"></script>
  </body>
</html>
