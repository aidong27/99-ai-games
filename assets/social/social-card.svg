<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">99 AI Games social card</title>
  <desc id="desc">Protocol 99 compares different AI coding systems on one fixed playable browser-game challenge.</desc>
